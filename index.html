<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Matiani 360° | Biograpi Living</title>
<link rel="stylesheet" href="pannellum.css">
<style>
  html,body{margin:0;padding:0;height:100%;background:#DD8A54;overflow:hidden;}
  #pano{width:100%;height:100vh;background:#DD8A54;}
  .bare-logo{position:absolute;top:16px;left:16px;z-index:6;height:52px;width:auto;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,.45));pointer-events:none;user-select:none;}
  .view-switch{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
    z-index:6;display:flex;gap:4px;padding:4px;border-radius:999px;
    background:rgba(23,17,12,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 4px 18px rgba(0,0,0,.35);}
  .view-switch button{border:0;cursor:pointer;border-radius:999px;
    font:700 14px/1 -apple-system,Segoe UI,Roboto,'Noto Sans Georgian',sans-serif;
    letter-spacing:.02em;color:#EEECD5;background:transparent;padding:10px 20px;transition:.15s;}
  .view-switch button.active{background:#EEECD5;color:#17110C;}
  .view-switch button:not(.active):hover{background:rgba(238,236,213,.14);}
  @media (max-width:600px){
    .bare-logo{height:42px;top:12px;left:12px;}
    .view-switch button{padding:9px 16px;font-size:13px;}
  }
  /* BGP logo link v1 */
  .bgp-logo-link .bare-logo{pointer-events:auto;cursor:pointer;-webkit-touch-callout:none;}
  .bgp-logo-link{-webkit-tap-highlight-color:transparent;}
</style>
</head>
<body>
<div id="pano"></div>
<a id="bgp-logo-link" class="bgp-logo-link" href="https://biograpi.ge/ka/mt/apartments?view=grid" aria-label="MATIANI by Biograpi"><img class="bare-logo" src="logo.png" alt="MATIANI by Biograpi"></a>
<script>
/* BGP logo link v1: logo opens the project grid on biograpi.ge in the visitor's language.
   Language comes from ?lang=ka|en|ru (added to the 360 links on biograpi.ge by GTM),
   then from sessionStorage, else ka. Without JS the static href (ka) still works. */
(function () {
  var PATH = "mt/apartments?view=grid";
  var a = document.getElementById("bgp-logo-link");
  if (!a) return;
  var lang = "ka", m = /[?&]lang=(ka|en|ru)(?:&|$)/.exec(location.search);
  try {
    if (m) { lang = m[1]; sessionStorage.setItem("bgp_lang", lang); }
    else if (/^(ka|en|ru)$/.test(sessionStorage.getItem("bgp_lang") || "")) lang = sessionStorage.getItem("bgp_lang");
  } catch (e) { if (m) lang = m[1]; }
  a.href = "https://biograpi.ge/" + lang + "/" + PATH;
})();
</script>
<div class="view-switch">
  <button id="btn-view1" class="active" onclick="go('view1')">ხედი 1</button>
  <button id="btn-view2" onclick="go('view2')">ხედი 2</button>
</div>
<script src="pannellum.js"></script>
<script>
  function scene(base){return{
    type:'multires',
    multiRes:{basePath:base,path:'/%l/%s%y_%x',fallbackPath:'/fallback/%s',
      extension:'jpg',tileResolution:512,maxLevel:4,cubeResolution:2600},
    hfov:100
  };}
  var viewer = pannellum.viewer('pano', {
    default:{
      firstScene:'view1', autoLoad:true, autoRotate:-2, autoRotateInactivityDelay:3500,
      backgroundColor:[0.867,0.541,0.329], sceneFadeDuration:900,
      showControls:false, showZoomCtrl:false, showFullscreenCtrl:false,
      keyboardZoom:true, mouseZoom:true, minHfov:50, maxHfov:120, compass:false
    },
    scenes:{ view1: scene('view1'), view2: scene('view2') }
  });
  function go(id){ viewer.loadScene(id); }
  viewer.on('scenechange', function(id){
    document.getElementById('btn-view1').classList.toggle('active', id==='view1');
    document.getElementById('btn-view2').classList.toggle('active', id==='view2');
  });
</script>
</body>
</html>
